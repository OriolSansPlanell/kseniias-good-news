<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kseniia's Good News</title>
<meta name="description" content="Positive news from ten sources, scored 0–10 for goodness, in English, Catalan, French and Russian. Refreshed every six hours.">
<meta name="theme-color" content="#EEF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1715" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Good News">
<link rel="alternate" type="application/rss+xml" title="Kseniia's Good News" href="feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&family=Onest:wght@500;700;800&family=Golos+Text:wght@400;600&display=swap">
<style>
/* Layout: one calm reading column (plus a world panel beside it on wide screens);
   a morning-sky palette; the 0–10 score is the only loud colour on the page.
   Onest and Golos Text only load for Cyrillic glyphs (Russian). */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --ink:#12302A; --muted:#5A726C; --line:#D4E0DC;
  --accent:#0F6E5C; --accent-ink:#FFFFFF; --sun:#D98A12; --sun-tint:#FFF3DC; --chip:#E2ECE9;
  --nodata:#D6E0DD; --flash:#FFE7B8;
  --shadow:0 1px 2px rgba(18,48,42,.06),0 4px 14px rgba(18,48,42,.05);
  --f-display:"Bricolage Grotesque","Onest","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Golos Text",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1715; --surface:#15211F; --ink:#E3EEEA; --muted:#93ABA4; --line:#26372F;
  --accent:#5CC9AE; --accent-ink:#06201A; --sun:#F2B544; --sun-tint:#2A2414; --chip:#1D2C29;
  --nodata:#25332F; --flash:#3A3220;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1715; --surface:#15211F; --ink:#E3EEEA; --muted:#93ABA4; --line:#26372F;
  --accent:#5CC9AE; --accent-ink:#06201A; --sun:#F2B544; --sun-tint:#2A2414; --chip:#1D2C29;
  --nodata:#25332F; --flash:#3A3220;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
img,svg{max-width:100%}
a{color:var(--accent)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px 8px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.4rem;letter-spacing:-.02em;line-height:1.1;display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.brand h1 .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand h1 .who{font-weight:500;color:var(--muted)}
.sunmark{width:22px;height:22px;flex:none}
.lang{position:relative;flex:none}
.lang-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:.82rem;font-weight:700;cursor:pointer}
.lang-btn svg{width:15px;height:15px}
.lang-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:4px;min-width:150px;display:grid;z-index:30}
.lang-menu button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.lang-menu button:hover{background:var(--chip)}
.lang-menu button[aria-checked="true"]{font-weight:700}
.lang-menu .code{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.subrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tabs{min-width:0;flex:0 1 auto;display:flex;gap:3px;background:var(--chip);padding:3px;border-radius:999px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:5px 13px;border-radius:999px;font-size:.86rem;font-weight:700;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .n{font-family:var(--f-mono);font-weight:500;font-size:.72rem;margin-left:4px;opacity:.8}
.updated{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.02em}

/* Page layout */
.layout{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
@media (min-width:1000px){
  .layout{grid-template-columns:minmax(0,1fr) 340px;gap:32px}
  .world{position:sticky;top:116px;max-height:calc(100vh - 130px);overflow-y:auto;scrollbar-width:thin;padding-bottom:4px}
  .world .mood{grid-template-columns:1fr}
  .tab[data-tab="world"]{display:none}
}
@media (max-width:999px){
  body:not([data-tab="world"]) .world{display:none}
  body[data-tab="world"] .main{display:none}
}
.main{min-width:0;display:grid;gap:14px;align-content:start}

/* Filters */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;align-items:center}
.filters::-webkit-scrollbar{display:none}
.pill{flex:none;position:relative;display:inline-flex;align-items:center}
.pill select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 28px 6px 12px;font-size:.84rem;font-weight:700;cursor:pointer;max-width:62vw}
.pill.on select{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none;opacity:.6}
.pill.on::after{color:var(--bg)}
.clear{flex:none;border:0;background:none;color:var(--accent);font-weight:700;font-size:.82rem;cursor:pointer;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}

/* Goodness slider */
.slider-row{--thumb:9px;display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px 8px}
.slider-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.slider-row label{font-size:.84rem;font-weight:700;white-space:nowrap}
.slider-row input{width:100%;margin:0;accent-color:var(--sun);height:22px;cursor:pointer}
.slider-row output{font-family:var(--f-mono);font-size:.85rem;font-weight:600;min-width:2.6em;text-align:center;border-radius:6px;padding:1px 4px;color:#10221E}
.nhist{position:relative;height:46px;margin-top:2px}
.nhist button{position:absolute;bottom:0;transform:translateX(-50%);width:calc((100% - 2 * var(--thumb)) / 10 - 4px);max-width:26px;border:0;padding:0;background:none;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.nhist .bar{display:block;border-radius:3px 3px 1px 1px;min-height:2px;transition:opacity .2s}
.nhist button.off .bar{opacity:.22}
.nhist .n{font-family:var(--f-mono);font-size:.58rem;color:var(--muted);line-height:1;margin-bottom:2px;text-align:center}
.nticks{position:relative;height:12px}
.nticks span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono);font-size:.6rem;color:var(--muted);line-height:1}
@media (min-width:1000px){.world .hist{display:none}}

/* Brightest strip */
.strip-wrap{display:grid;gap:6px}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--sun)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:thin}
.mini{scroll-snap-align:start;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:linear-gradient(150deg,var(--sun-tint),var(--surface) 75%);border-radius:12px;padding:10px;cursor:pointer;min-width:0}
.mini .badge{width:34px;height:34px;font-size:.95rem;border-radius:9px}
.mini span.t{font-family:var(--f-display);font-weight:700;font-size:.9rem;line-height:1.22;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* Feed */
.day{margin:12px 0 2px;font-family:var(--f-display);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:10px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 13px 11px;display:grid;grid-template-columns:auto 1fr;gap:12px;min-width:0;transition:background-color .6s}
.card.is-read{opacity:.62}
.card.flash{background:var(--flash)}
.badge{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:1.1rem;color:#10221E;font-variant-numeric:tabular-nums}
.body{min-width:0;display:grid;gap:4px}
.meta{font-size:.75rem;color:var(--muted);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.meta .cat{font-weight:700;color:var(--ink)}
.meta .dot{opacity:.5}
.tag{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1px 6px}
.tag.new{background:var(--sun);color:#1A1405}
.tag.orig{border:1px solid var(--line);color:var(--muted);font-family:var(--f-mono);letter-spacing:0}
.card h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.06rem;line-height:1.22;text-wrap:balance}
.sum{margin:0;font-size:.94rem;opacity:.9}
.why{font-size:.84rem;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin:2px 0 0}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.go{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;font-size:.82rem;padding:7px 12px;border-radius:999px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 10px;font-size:.78rem;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:5px;min-height:32px}
.ghost[aria-pressed="true"]{color:var(--sun);border-color:var(--sun)}
.ghost svg,.go svg{width:14px;height:14px;flex:none}
@media (max-width:480px){.actions{gap:5px}.ghost{padding:6px 8px}.go{padding:7px 11px}}
.empty{margin-top:8px;text-align:center;color:var(--muted);padding:26px 16px;border:1px dashed var(--line);border-radius:var(--r)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.1rem;margin-bottom:4px}

/* World panel */
.world{display:grid;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.panel h2{margin:0;font-family:var(--f-display);font-size:1rem;font-weight:700}
.hint{font-size:.78rem;color:var(--muted);margin:0}
.mood{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end}
.mood-num{font-family:var(--f-display);font-weight:800;font-size:2.5rem;line-height:.9;font-variant-numeric:tabular-nums}
.mood-num small{font-size:.9rem;color:var(--muted);font-weight:500}
.mood-lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:6px}
.hist{display:flex;align-items:flex-end;gap:3px;height:54px;min-width:0}
.hist .col{flex:1;display:flex;flex-direction:column;gap:3px;height:100%;justify-content:flex-end;min-width:0}
.hist .bar{border-radius:3px 3px 1px 1px;min-height:2px}
.hist .col.off .bar{opacity:.22}
.hist .tick{font-family:var(--f-mono);font-size:.6rem;color:var(--muted);text-align:center;line-height:1}
.map{width:100%;height:auto;display:block}
.map path{stroke:var(--surface);stroke-width:.5;cursor:pointer;transition:opacity .2s}
.map path:hover{opacity:.82}
.map.has-sel path:not(.sel){opacity:.35}
.legend{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.legend .ramp{flex:1;height:8px;border-radius:4px}
.legend .nd{display:inline-flex;align-items:center;gap:4px}
.legend .nd i{width:10px;height:10px;border-radius:3px;background:var(--nodata);display:inline-block}
.conts{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.conts button{width:100%;display:grid;grid-template-columns:1fr auto 34px;gap:10px;align-items:center;border:0;background:none;padding:6px 6px;border-radius:8px;cursor:pointer;text-align:left;font-size:.86rem}
.conts button:hover,.conts button[aria-pressed="true"]{background:var(--chip)}
.conts .cnt{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.conts .sc{font-family:var(--f-mono);font-weight:600;font-size:.8rem;text-align:center;border-radius:6px;padding:1px 0;color:#10221E}
.conts .sc.none{background:var(--nodata);color:var(--muted)}
.trend{display:flex;align-items:flex-end;gap:4px;height:70px}
.trend .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;height:100%;min-width:0}
.trend .bar{border-radius:3px 3px 1px 1px;min-height:2px;position:relative}
.trend .bar.none{background:var(--nodata)!important}
.trend .tick{font-family:var(--f-mono);font-size:.58rem;color:var(--muted);text-align:center;line-height:1;white-space:nowrap;overflow:hidden}
.trend .val{font-family:var(--f-mono);font-size:.58rem;color:var(--muted);text-align:center;line-height:1}

/* Calendar + Nobel hub */
.cal{display:grid;gap:16px}
.hub{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.hub-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hub h2{margin:0;font-family:var(--f-display);font-size:1.3rem;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-body);font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#C8372D;border-radius:999px;padding:2px 9px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.hub-sub{font-size:.8rem;color:var(--muted);margin:0}
.prizes{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.prizes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prize{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;align-content:start;min-width:0;background:var(--bg)}
.prize.done{background:linear-gradient(160deg,var(--sun-tint),var(--surface) 70%)}
.prize.full{grid-column:1/-1}
.prize .pname{font-family:var(--f-display);font-weight:700;font-size:1.02rem;line-height:1.2}
.prize .when{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.prize .state{font-size:.84rem;font-weight:700;color:var(--accent)}
.prize .state.now{color:#C8372D}
.laureates{display:grid;gap:6px;margin:2px 0 0;padding:0;list-style:none}
.laureates li{display:grid;gap:1px}
.laureates b{font-family:var(--f-display);font-size:1rem}
.laureates span{font-size:.78rem;color:var(--muted)}
.motiv{margin:0;font-size:.92rem}
.motiv em{font-style:normal;font-weight:700;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;display:block}
.expl{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.expl h4{margin:0;font-family:var(--f-display);font-size:.88rem}
.expl p{margin:0;font-size:.92rem;max-width:65ch}
.srclinks{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem}
.evfilters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.evfilters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.month{margin:6px 0 0;font-family:var(--f-display);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:10px}
.month::after{content:"";flex:1;height:1px;background:var(--line)}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:52px 1fr;gap:12px;min-width:0}
.ev.today{border-color:var(--sun)}
.evdate{border-radius:10px;background:var(--chip);display:grid;place-items:center;align-content:center;padding:6px 0;text-align:center;height:max-content}
.evdate b{font-family:var(--f-display);font-size:1.3rem;line-height:1}
.evdate span{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ev h3{margin:0;font-family:var(--f-display);font-size:1rem;line-height:1.25}
.ev p{margin:0;font-size:.9rem;opacity:.9}
.ev .meta{margin-bottom:2px}
.cat-Sky{color:#5B6BD6}.cat-Space{color:#8A55C9}.cat-Awards{color:var(--sun)}.cat-Environment{color:#2F9E5B}.cat-Society{color:#D0577A}.cat-Science{color:#2B8FB3}
.linkbtn{justify-self:start;border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:.8rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* About */
.about{display:grid;gap:14px}
.about section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.about h2{margin:0 0 8px;font-family:var(--f-display);font-size:1.12rem}
.about p{margin:0 0 8px;max-width:65ch}
.scale{display:grid;gap:6px;margin-top:6px}
.scale div{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;font-size:.9rem}
.scale span.sw{font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:#10221E;text-align:center;border-radius:6px;padding:3px 0}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.srcs span{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.82rem}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:700;box-shadow:var(--shadow);z-index:40;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:420px){.brand h1{font-size:1.18rem}.mood{grid-template-columns:1fr}}
</style>
</head>
<body data-tab="news">
<header class="top">
  <div class="top-in">
    <div class="brand">

  };

  function pickLang(){
    const saved = store.get("lang", null);
    if(saved && T[saved]) return saved;
    for(const l of (navigator.languages || [navigator.language || "en"])){
      const c = String(l).slice(0,2).toLowerCase();
      if(T[c]) return c;
    }
    return "en";
  }

  // ---------- state ----------
  const st = {
    lang: pickLang(), stories: [], meta: null, site: null, loaded: false, failed: false,
    min: store.get("min", 6), cat: store.get("cat", "All"), cont: store.get("cont", "All"), sort: store.get("sort", "new"),
    tab: "news", saved: new Set(store.get("saved", [])), read: new Set(store.get("read", [])),
    open: new Set(), fetchedAt: 0, world: null, events: null, nobel: null, evCat: "All", openPrize: new Set(), prevVisit: store.get("lastVisit", null)
  };
  const L = () => T[st.lang];
  const fmt = (s, o) => String(s).replace(/\{(\w+)\}/g, (_, k) => o[k] ?? "");
  const plural = (forms, n) => { let k = "other"; try{ k = new Intl.PluralRules(st.lang).select(n); }catch(e){} return fmt(forms[k] || forms.other, {n}); };
  const contName = c => L().conts[c] || c;
  const catName = c => L().cats[c] || c;

  function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function tx(s, f){ return (st.lang !== "en" && s.i18n && s.i18n[st.lang] && s.i18n[st.lang][f]) || s[f]; }
  function translated(s){ return st.lang === "en" || !!(s.i18n && s.i18n[st.lang]); }

  function lerp(a,b,t){ return a+(b-a)*t; }
  const STOPS = [[0,[262,22,62]],[4,[214,28,62]],[6,[168,42,56]],[8,[96,48,58]],[10,[42,92,58]]];
  function scoreColor(s){
    s = Math.max(0, Math.min(10, Number(s)||0));
    for(let i=0;i<STOPS.length-1;i++){
      const [a,ca]=STOPS[i],[b,cb]=STOPS[i+1];
      if(s<=b){ const t=(s-a)/(b-a); return `hsl(${lerp(ca[0],cb[0],t).toFixed(1)} ${lerp(ca[1],cb[1],t).toFixed(1)}% ${lerp(ca[2],cb[2],t).toFixed(1)}%)`; }
    }
    return "hsl(42 92% 58%)";
  }
  function rel(iso){
    const t = Date.parse(iso); if(!t) return "";
    const sec = (t - Date.now())/1000, a = Math.abs(sec);
    let rtf; try{ rtf = new Intl.RelativeTimeFormat(st.lang, {numeric:"auto"}); }catch(e){ return ""; }
    if(a < 60) return rtf.format(0, "second");
    if(a < 3600) return rtf.format(Math.round(sec/60), "minute");
    if(a < 86400) return rtf.format(Math.round(sec/3600), "hour");
    return rtf.format(Math.round((startOfDay(t) - startOfDay(Date.now()))/86400000), "day");
  }
  const cap = s => s ? s.charAt(0).toLocaleUpperCase(st.lang) + s.slice(1) : s;
  function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
  function dayLabel(iso){
    const d = new Date(iso); if(isNaN(d)) return "";
    const diff = Math.round((startOfDay(Date.now()) - startOfDay(d))/86400000);
    if(diff <= 1){ try{ return cap(new Intl.RelativeTimeFormat(st.lang,{numeric:"auto"}).format(-Math.max(diff,0),"day")); }catch(e){} }
    return cap(d.toLocaleDateString(st.lang,{weekday:"long", day:"numeric", month:"long"}));
  }
  function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,1800); }
  const recent = days => { const c = Date.now()-days*86400000; return st.stories.filter(s => Date.parse(s.published) >= c); };
  const avg = arr => arr.length ? arr.reduce((a,s)=>a+(Number(s.score)||0),0)/arr.length : null;
  const isNew = s => st.prevVisit && Date.parse(s.added) > Date.parse(st.prevVisit);

  const ICON_EXT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 3h4v4M13 3 7.5 8.5M12 9.5V13H3V4h3.5"/></svg>';
  const ICON_STAR = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="m8 1.8 1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>';
  const ICON_SHARE = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 10V2.5M5 5.5l3-3 3 3M3.5 8.5v5h9v-5"/></svg>';
  const ICON_Q = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6.3 6.2a1.8 1.8 0 1 1 2.5 1.7c-.5.2-.8.6-.8 1.1v.4"/><circle cx="8" cy="11.6" r=".5" fill="currentColor"/></svg>';
  const canShare = typeof navigator.share === "function";

  // ---------- render: header ----------
  function renderHeader(){
    const l = L();
    document.documentElement.lang = st.lang;
    document.title = fmt(l.name, {who: l.who});
    $("#appname").innerHTML = esc(l.name).replace("{who}", `<span class="who">${esc(l.who)}</span>`);
    $("#lang-code").textContent = st.lang.toUpperCase();
    $("#lang-menu").innerHTML = LANGS.map(([c,n]) => `<button role="menuitemradio" aria-checked="${c===st.lang}" data-lang="${c}"><span>${n}</span><span class="code">${c.toUpperCase()}</span></button>`).join("");
    $("#tabs").innerHTML = ["news","world","calendar","saved","about"].map(t =>
      `<button class="tab" role="tab" data-tab="${t}" aria-selected="${t===st.tab}">${esc(l.tabs[t])}${t==="saved"&&st.saved.size?`<span class="n">${st.saved.size}</span>`:""}</button>`).join("");
    const m = st.meta;
    $("#updated").textContent = st.failed && !st.loaded ? l.unreachable : (m && m.updated) ? fmt(l.updated, {t: rel(m.updated)}) : (st.loaded ? "" : l.loading);
    document.body.dataset.tab = st.tab;
    $("#newsview").hidden = !(st.tab === "news" || st.tab === "saved" || st.tab === "world");
    $("#aboutview").hidden = st.tab !== "about";
    $("#calview").hidden = st.tab !== "calendar";
    if(st.tab === "calendar") $("#newsview").hidden = true;
  }

  // ---------- render: filters + strip + feed ----------
  function sel(id, value, opts, on){
    return `<label class="pill${on?' on':''}"><select id="${id}" aria-label="${esc(opts[0][1])}">${opts.map(([v,t])=>`<option value="${esc(v)}"${String(v)===String(value)?" selected":""}>${esc(t)}</option>`).join("")}</select></label>`;
  }
  function renderSlider(){
    const l = L(), inp = $("#min"), out = $("#min-val");
    $("#min-lbl").textContent = l.minGood;
    if(document.activeElement !== inp) inp.value = st.min;
    out.textContent = st.min > 0 ? st.min + "+" : "0+";
    out.style.background = scoreColor(st.min);
    inp.setAttribute("aria-valuetext", st.min > 0 ? fmt(l.scoreN, {n: st.min}) : l.allScores);
    const counts = Array(11).fill(0);
    for(const s of st.stories){ const k = Math.round(Number(s.score)); if(k >= 0 && k <= 10) counts[k]++; }
    const mx = Math.max(1, ...counts);
    const pos = i => `left:calc(var(--thumb) + (100% - 2 * var(--thumb)) * ${i/10})`;
    $("#nhist").innerHTML = counts.map((c,i) => `<button type="button" tabindex="-1" data-setmin="${i}" class="${i < st.min ? "off" : ""}" style="${pos(i)}" title="${esc(plural(l.stories, c))} · ${i}/10">${c ? `<span class="n">${c}</span>` : ""}<span class="bar" style="height:${c ? Math.round(c/mx*30)+3 : 2}px;background:${scoreColor(i)}"></span></button>`).join("");
    $("#nticks").innerHTML = counts.map((_,i) => `<span style="${pos(i)}">${i}</span>`).join("");
  }
  function renderFilters(){
    const box = $("#filters");
    if(st.tab !== "news"){ box.hidden = true; $("#sliderrow").hidden = true; return; }
    box.hidden = false; $("#sliderrow").hidden = false;
    const l = L();
    renderSlider();
    const cats = Array.from(new Set(st.stories.map(s=>s.category).filter(Boolean))).sort((a,b)=>catName(a).localeCompare(catName(b), st.lang));
    if(st.loaded && st.cat !== "All" && !cats.includes(st.cat)) st.cat = "All";
    const active = st.min !== 6 || st.cat !== "All" || st.cont !== "All";
    box.innerHTML =
      sel("f-cat", st.cat, [["All",l.allTopics],...cats.map(c=>[c,catName(c)])], st.cat !== "All") +
      sel("f-cont", st.cont, [["All",l.allConts],...CONTS.map(c=>[c,contName(c)])], st.cont !== "All") +
      sel("f-sort", st.sort, [["new",l.newest],["best",l.brightest]], false) +
      (active ? `<button class="clear" id="f-clear">${esc(l.clear)}</button>` : "");
  }

  function cardHTML(s){
    const l = L(), saved = st.saved.has(s.id), open = st.open.has(s.id);
    const meta = [`<span class="cat">${esc(catName(s.category||""))}</span>`, esc(contName(s.continent||"Global")), esc(s.source||""), esc(rel(s.published))]
      .filter(Boolean).join('<span class="dot">·</span>');
    const why = tx(s,"why");
    return `<article class="card${st.read.has(s.id)?' is-read':''}" id="s-${esc(s.id)}" data-id="${esc(s.id)}">
      <div class="badge" style="background:${scoreColor(s.score)}" aria-label="${esc(s.score)}/10">${esc(s.score)}</div>
      <div class="body">
        <div class="meta">${isNew(s)?`<span class="tag new">${esc(l.isNew)}</span>`:""}${meta}${translated(s)?"":`<span class="tag orig" title="${esc(l.orig)}">EN</span>`}</div>
        <h3>${esc(tx(s,"title"))}</h3>
        <p class="sum">${esc(tx(s,"summary"))}</p>
        ${open && why ? `<p class="why">${esc(fmt(l.whyN,{n:s.score}))} ${esc(why)}</p>` : ""}
        <div class="actions">
          <a class="go" href="${esc(s.url)}" target="_blank" rel="noopener" data-act="read">${esc(l.read)} ${ICON_EXT}</a>
          ${why?`<button class="ghost" data-act="why" aria-expanded="${open}" title="${esc(open?l.hideWhy:l.why)}">${ICON_Q}<span class="lbl">${esc(open?l.hideWhy:l.whyShort)}</span></button>`:""}
          <button class="ghost" data-act="save" aria-pressed="${saved}" title="${esc(saved?l.saved:l.save)}">${ICON_STAR}<span class="lbl">${esc(saved?l.saved:l.save)}</span></button>
          <button class="ghost" data-act="share" title="${esc(canShare?l.share:l.copy)}">${ICON_SHARE}<span class="lbl">${esc(canShare?l.share:l.copy)}</span></button>
        </div>
      </div>
    </article>`;
  }

  function empty([a,b]){ return `<div class="empty"><strong>${esc(a)}</strong>${esc(b)}</div>`; }

  function renderFeed(){
    const l = L(), feed = $("#feed"), strip = $("#strip");
    if(st.tab === "about" || st.tab === "calendar"){ return; }
    if(!st.loaded){ strip.innerHTML = ""; feed.innerHTML = empty(st.failed ? l.failed : l.fetching); return; }
    if(!st.stories.length){ strip.innerHTML = ""; feed.innerHTML = empty(l.noStories); return; }

    let list;
    if(st.tab === "saved"){
      strip.innerHTML = "";
      list = st.stories.filter(s=>st.saved.has(s.id));
      if(!list.length){ feed.innerHTML = empty(l.noSaved); return; }
    } else {
      const pool = recent(2).length ? recent(2) : st.stories;
      const top = pool.slice().sort((a,b)=>(b.score-a.score)||(Date.parse(b.published)-Date.parse(a.published))).slice(0,3);
      strip.innerHTML = top.length ? `<div class="strip-wrap"><div class="eyebrow">${esc(l.stripLbl)}</div><div class="strip">${top.map(s=>
        `<button class="mini" data-jump="${esc(s.id)}"><span class="badge" style="background:${scoreColor(s.score)}">${esc(s.score)}</span><span class="t">${esc(tx(s,"title"))}</span></button>`).join("")}</div></div>` : "";
      list = st.stories.filter(s => (Number(s.score)||0) >= st.min && (st.cat==="All" || s.category===st.cat) && (st.cont==="All" || s.continent===st.cont));
      if(!list.length){ feed.innerHTML = empty(l.noMatch); return; }
    }
    if(st.sort === "best" && st.tab === "news"){
      list.sort((a,b)=>(b.score-a.score)||(Date.parse(b.published)-Date.parse(a.published)));
      feed.innerHTML = `<div class="day">${esc(l.byGood)}</div><div class="list">${list.map(cardHTML).join("")}</div>`;
    } else {
      list.sort((a,b)=>Date.parse(b.published)-Date.parse(a.published));
      let html = "", cur = null;
      for(const s of list){
        const d = dayLabel(s.published);
        if(d !== cur){ if(cur !== null) html += "</div>"; html += `<div class="day">${esc(d)}</div><div class="list">`; cur = d; }
        html += cardHTML(s);
      }
      feed.innerHTML = html + "</div>";
    }
  }

  // ---------- render: world panel ----------
  function contStats(){
    const pool = recent(3);
    const out = {};
    for(const c of CONTS){ const xs = pool.filter(s => s.continent === c); out[c] = {n: xs.length, avg: avg(xs)}; }
    return out;
  }
  function renderWorld(){
    const l = L();
    const r3 = recent(3), a = avg(r3.length ? r3 : st.stories);
    $("#mood").innerHTML = (a==null ? "–" : a.toLocaleString(st.lang,{minimumFractionDigits:1,maximumFractionDigits:1})) + "<small>/10</small>";
    $("#mood-lbl").textContent = r3.length ? `${l.avg3} · ${plural(l.stories, r3.length)}` : l.avg3;
    const counts = Array(11).fill(0);
    for(const s of st.stories){ const k = Math.round(Number(s.score)); if(k>=0 && k<=10) counts[k]++; }
    const mx = Math.max(1, ...counts);
    $("#hist").innerHTML = counts.map((c,i)=>`<div class="col${i<st.min?' off':''}" title="${c}"><div class="bar" style="height:${Math.round(c/mx*38)+2}px;background:${scoreColor(i)}"></div><div class="tick">${i}</div></div>`).join("");

    $("#map-title").textContent = l.mapTitle;
    $("#map-hint").textContent = l.mapHint;
    $("#nd-lbl").textContent = l.noData;
    $("#ramp").style.background = `linear-gradient(90deg,${[0,2,4,6,8,10].map(scoreColor).join(",")})`;
    const cs = contStats();
    if(st.world){
      const svg = $("#map");
      svg.setAttribute("viewBox", `0 0 ${st.world.w} ${st.world.h}`);
      svg.classList.toggle("has-sel", st.cont !== "All");
      svg.innerHTML = Object.entries(st.world.paths).map(([c,d]) => {
        const x = cs[c] || {n:0};
        const fill = x.n ? scoreColor(x.avg) : "var(--nodata)";
        const label = `${contName(c)}: ${x.n ? x.avg.toFixed(1)+"/10 · "+plural(l.stories,x.n) : l.noData}`;
        return `<path d="${d}" data-cont="${esc(c)}" class="${st.cont===c?'sel':''}" style="fill:${fill}" tabindex="0" role="button" aria-label="${esc(label)}"><title>${esc(label)}</title></path>`;
      }).join("");
    }
    $("#conts").innerHTML = CONTS.map(c => {
      const x = cs[c];
      return `<li><button data-cont="${esc(c)}" aria-pressed="${st.cont===c}"><span>${esc(contName(c))}</span><span class="cnt">${x.n ? esc(plural(l.stories,x.n)) : ""}</span><span class="sc${x.n?'':' none'}" style="${x.n?`background:${scoreColor(x.avg)}`:""}">${x.n ? x.avg.toFixed(1) : "–"}</span></button></li>`;
    }).join("");

    $("#trend-title").textContent = l.trendTitle;
    const days = [];
    for(let i=9;i>=0;i--){
      const d0 = startOfDay(Date.now() - i*86400000), d1 = d0.getTime()+86400000;
      const xs = st.stories.filter(s => { const t = Date.parse(s.published); return t >= d0.getTime() && t < d1; });
      days.push({d:d0, avg: avg(xs), n: xs.length});
    }
    $("#trend").innerHTML = days.map(x => `<div class="col" title="${esc(x.d.toLocaleDateString(st.lang,{day:"numeric",month:"short"}))}: ${x.n ? x.avg.toFixed(1)+"/10 · "+esc(plural(l.stories,x.n)) : esc(l.noData)}">
      <div class="val">${x.n ? x.avg.toFixed(1) : ""}</div>
      <div class="bar${x.n?'':' none'}" style="height:${x.n ? Math.round(x.avg/10*44)+2 : 2}px;background:${x.n?scoreColor(x.avg):""}"></div>
      <div class="tick">${esc(x.d.toLocaleDateString(st.lang,{day:"numeric"}))}</div></div>`).join("");
  }

  function renderAbout(){
    if(st.tab !== "about") return;
    const l = L();
    const srcs = (st.site && Array.isArray(st.site.sources)) ? st.site.sources.map(s=>s.name) : Array.from(new Set(st.stories.map(s=>s.source).filter(Boolean)));
    $("#aboutview").innerHTML = l.about.map(([h, ps, extra]) => `<section><h2>${esc(h)}</h2>${ps.map(p=>`<p>${esc(p).replace("feed.xml",'<a href="feed.xml">feed.xml</a>')}</p>`).join("")}${
      extra==="scale" ? `<div class="scale">${SCALE_N.map(([n,lab],i)=>`<div><span class="sw" style="background:${scoreColor(n)}">${lab}</span><span>${esc(l.scale[i])}</span></div>`).join("")}</div>` :
      extra==="srcs" ? `<div class="srcs">${srcs.map(s=>`<span>${esc(s)}</span>`).join("")}</div>` : ""}</section>`).join("");
  }

  // ---------- render: calendar + Nobel hub ----------
  const CL = () => C[st.lang];
  function fmtWhen(iso, opts){ try{ return new Date(iso).toLocaleString(st.lang, opts); }catch(e){ return iso; } }
  function relLong(iso){
    const t = Date.parse(iso), sec = (t - Date.now())/1000, a = Math.abs(sec);
    let rtf; try{ rtf = new Intl.RelativeTimeFormat(st.lang, {numeric:"auto"}); }catch(e){ return ""; }
    if(a < 3600) return rtf.format(Math.round(sec/60), "minute");
    if(a < 86400) return rtf.format(Math.round(sec/3600), "hour");
    return rtf.format(Math.round((startOfDay(t) - startOfDay(Date.now()))/86400000), "day");
  }
  function prizeText(p, f){ return (st.lang !== "en" && p.i18n && p.i18n[st.lang] && p.i18n[st.lang][f]) || p[f] || ""; }
  function laureateText(p, l, f){
    const tr = st.lang !== "en" && p.i18n && p.i18n[st.lang] && p.i18n[st.lang].profiles && p.i18n[st.lang].profiles[l.name];
    return (tr && tr[f]) || l[f] || "";
  }
  function renderNobel(){
    const n = st.nobel; if(!n || !Array.isArray(n.prizes) || !n.prizes.length) return "";
    const end = Date.parse((n.ceremony || "") + "T23:59:59Z") || (Date.parse(n.prizes[n.prizes.length-1].at) + 70*86400000);
    if(Date.now() > end) return "";
    const c = CL(), now = Date.now();
    const isLive = n.prizes.some(p => { const t = Date.parse(p.at); return now >= t - 3600e3 && now <= t + 8*3600e3; });
    const cards = n.prizes.map(p => {
      const t = Date.parse(p.at), name = c.prizes[p.id] || p.id, open = st.openPrize.has(p.id);
      const when = fmtWhen(p.at, {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
      let body = "";
      if(p.status === "announced" && p.laureates){
        const expl = prizeText(p,"explainer"), why = prizeText(p,"why");
        body = `<ul class="laureates">${p.laureates.map(l => `<li><b>${esc(l.name)}</b>${laureateText(p,l,"info") ? `<span>${esc(laureateText(p,l,"info"))}</span>` : ""}</li>`).join("")}</ul>
          <p class="motiv"><em>${esc(c.motivation)}</em>${esc(prizeText(p,"motivation"))}</p>
          ${(expl || why || p.laureates.some(l=>l.profile)) ? `<button class="linkbtn" data-prize="${esc(p.id)}" aria-expanded="${open}">${esc(open ? c.hideExpl : c.explained)}</button>` : ""}
          ${open ? `<div class="expl">
            ${expl ? `<p>${esc(expl)}</p>` : ""}
            ${why ? `<h4>${esc(c.why)}</h4><p>${esc(why)}</p>` : ""}
            ${p.laureates.some(l=>laureateText(p,l,"profile")) ? `<h4>${esc(c.laureates)}</h4>${p.laureates.map(l => laureateText(p,l,"profile") ? `<p><b>${esc(l.name)}.</b> ${esc(laureateText(p,l,"profile"))}</p>` : "").join("")}` : ""}
            ${(p.sources||[]).length ? `<div class="srclinks"><span class="hint">${esc(c.sources)}:</span>${p.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join("")}</div>` : ""}
          </div>` : ""}`;
      } else if(p.status === "announced"){
        body = `<div class="state">${esc(c.waiting)}</div>`;
      } else if(now >= t){
        body = `<div class="state now">${esc(c.now)}</div>`;
      } else {
        body = `<div class="state">${esc(fmt(c.soon, {t: relLong(p.at)}))}</div><div><button class="linkbtn" data-ics-prize="${esc(p.id)}">${esc(c.addCal)}</button></div>`;
      }
      return `<article class="prize${p.status==="announced"?" done":""}${open?" full":""}" id="prize-${esc(p.id)}"><div class="pname">${esc(name)}</div><div class="when">${esc(when)}</div>${body}</article>`;
    }).join("");
    const cer = n.ceremony ? fmt(c.ceremony, {d: fmtWhen(n.ceremony + "T12:00:00Z", {day:"numeric", month:"long"})}) : "";
    return `<section class="hub" aria-labelledby="hub-h">
      <div class="hub-head"><h2 id="hub-h">${esc(fmt(c.nobel, {y: n.year}))}${isLive ? `<span class="live">${esc(c.live)}</span>` : ""}</h2>
      <span class="updated">${n.updated ? esc(fmt(L().updated, {t: rel(n.updated)})) : ""}</span></div>
      <p class="hub-sub">${esc(c.nobelIntro)} ${esc(c.earliest)}${cer ? " " + esc(cer) + "." : ""}</p>
      <div class="prizes">${cards}</div></section>`;
  }
  function evText(e, f){ return (st.lang !== "en" && e.i18n && e.i18n[st.lang] && e.i18n[st.lang][f]) || e[f]; }
  function evLastDay(e){
    if(e.end) return e.end;
    if(/^\d{4}-\d{2}$/.test(e.date)){ const [y,m] = e.date.split("-").map(Number); return new Date(Date.UTC(y, m, 0)).toISOString().slice(0,10); }
    return e.date;
  }
  function renderCalendar(){
    if(st.tab !== "calendar") return;
    const c = CL(), box = $("#calview");
    const today = new Date(); const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
    const evs = ((st.events && st.events.events) || []).filter(e => evLastDay(e) >= todayStr);
    const cats = ["All", ...Array.from(new Set(evs.map(e => e.category)))];
    if(!cats.includes(st.evCat)) st.evCat = "All";
    const shown = evs.filter(e => st.evCat === "All" || e.category === st.evCat);
    let html = renderNobel();
    html += `<div class="day" style="margin-top:4px">${esc(c.calTitle)}</div><p class="hint">${esc(c.calIntro)}</p>`;
    html += `<div class="evfilters">${cats.map(k => `<button class="chip" data-evcat="${esc(k)}" aria-pressed="${k===st.evCat}">${esc(k==="All" ? c.all : (c.cats[k]||k))}</button>`).join("")}</div>`;
    if(!st.events){ html += empty(L().fetching); }
    else if(!shown.length){ html += empty(c.none); }
    else {
      let cur = null;
      html += `<div class="list">`;
      for(const e of shown){
        const monthOnly = /^\d{4}-\d{2}$/.test(e.date);
        const d = new Date((monthOnly ? e.date + "-15" : e.date) + "T12:00:00");
        const mKey = e.date.slice(0,7);
        if(mKey !== cur){ html += `<div class="month">${esc(cap(d.toLocaleDateString(st.lang, {month:"long", year:"numeric"})))}</div>`; cur = mKey; }
        let range = "";
        if(monthOnly) range = c.tbc;
        else if(e.end){ const d2 = new Date(e.end + "T12:00:00"); range = `${d.toLocaleDateString(st.lang,{day:"numeric",month:"short"})} – ${d2.toLocaleDateString(st.lang,{day:"numeric",month:"short"})}`; }
        else if(e.at){ range = fmtWhen(e.at, {weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"}); }
        else range = cap(d.toLocaleDateString(st.lang, {weekday:"long", day:"numeric", month:"long"}));
        const isToday = e.date <= todayStr && evLastDay(e) >= todayStr;
        html += `<article class="ev${isToday?" today":""}">
          <div class="evdate">${monthOnly ? `<b>·</b><span>${esc(d.toLocaleDateString(st.lang,{month:"short"}))}</span>` : `<b>${d.getDate()}</b><span>${esc(d.toLocaleDateString(st.lang,{weekday:"short"}))}</span>`}</div>
          <div class="body"><div class="meta"><span class="cat cat-${esc(e.category)}">${esc(c.cats[e.category]||e.category)}</span><span class="dot">·</span>${esc(range)}</div>
          <h3>${esc(evText(e,"title"))}</h3><p>${esc(evText(e,"summary"))}</p>
          <div class="actions"><a class="linkbtn" href="${esc(e.link)}" target="_blank" rel="noopener">${esc(c.more)}</a>${monthOnly ? "" : `<button class="linkbtn" data-ics="${esc(e.id)}">${esc(c.addCal)}</button>`}</div></div></article>`;
      }
      html += `</div>`;
    }
    box.innerHTML = html;
  }
  function icsDate(d){ return d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); }
  function icsEsc(s){ return String(s||"").replace(/[\;,]/g, m => "\\" + m).replace(/\n/g, "\\n"); }
  function downloadIcs(name, title, desc, url, start, end, allDay){
    const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Kseniia's Good News//EN","BEGIN:VEVENT",
      "UID:" + name + "@kseniias-good-news", "DTSTAMP:" + icsDate(new Date()),
      allDay ? "DTSTART;VALUE=DATE:" + start.replace(/-/g,"") : "DTSTART:" + icsDate(new Date(start)),
      allDay ? "DTEND;VALUE=DATE:" + end.replace(/-/g,"") : "DTEND:" + icsDate(new Date(end)),
      "SUMMARY:" + icsEsc(title), "DESCRIPTION:" + icsEsc(desc + (url ? "\n" + url : "")), url ? "URL:" + url : "", "END:VEVENT","END:VCALENDAR"].filter(Boolean);
    const blob = new Blob([lines.join("\r\n")], {type:"text/calendar"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name + ".ics";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function nextDay(s){ const d = new Date(s + "T12:00:00Z"); d.setUTCDate(d.getUTCDate()+1); return d.toISOString().slice(0,10); }

  function render(){ renderHeader(); renderFilters(); renderFeed(); renderWorld(); renderAbout(); renderCalendar(); }

  // ---------- events ----------
  function setTab(t){
    if(t === "world" && matchMedia("(min-width:1000px)").matches) t = "news";
    st.tab = t; render(); window.scrollTo({top:0});
  }
  function setCont(c){
    st.cont = (st.cont === c) ? "All" : c; store.set("cont", st.cont);
    if(st.tab !== "news"){ st.tab = "news"; window.scrollTo({top:0}); }
    render();
  }
  function closeLang(){ $("#lang-menu").hidden = true; $("#lang-btn").setAttribute("aria-expanded","false"); }

  document.addEventListener("click", e => {
    if(e.target.closest("#lang-btn")){ const m=$("#lang-menu"); m.hidden=!m.hidden; $("#lang-btn").setAttribute("aria-expanded", String(!m.hidden)); return; }
    const lb = e.target.closest("[data-lang]");
    if(lb){ st.lang = lb.dataset.lang; store.set("lang", st.lang); closeLang(); render(); return; }
    if(!e.target.closest(".lang")) closeLang();
    const tab = e.target.closest(".tab"); if(tab){ setTab(tab.dataset.tab); return; }
    const sm = e.target.closest("[data-setmin]");
    if(sm){ st.min = Number(sm.dataset.setmin); store.set("min", st.min); $("#min").value = st.min; render(); return; }
    const ec = e.target.closest("[data-evcat]"); if(ec){ st.evCat = ec.dataset.evcat; renderCalendar(); return; }
    const pz = e.target.closest("[data-prize]");
    if(pz){ const id = pz.dataset.prize; st.openPrize.has(id) ? st.openPrize.delete(id) : st.openPrize.add(id); renderCalendar(); document.getElementById("prize-"+id)?.scrollIntoView({block:"nearest", behavior:"smooth"}); return; }
    const ip = e.target.closest("[data-ics-prize]");
    if(ip && st.nobel){ const p = st.nobel.prizes.find(x => x.id === ip.dataset.icsPrize); if(p){ const c = CL(); downloadIcs("nobel-"+p.id, fmt(c.nobel,{y:st.nobel.year}) + " · " + (c.prizes[p.id]||p.id), c.nobelIntro, "https://www.nobelprize.org/", p.at, new Date(Date.parse(p.at)+3600e3).toISOString(), false); } return; }
    const ie = e.target.closest("[data-ics]");
    if(ie && st.events){ const ev = st.events.events.find(x => x.id === ie.dataset.ics); if(ev){
      if(ev.at) downloadIcs(ev.id, evText(ev,"title"), evText(ev,"summary"), ev.link, ev.at, new Date(Date.parse(ev.at)+3600e3).toISOString(), false);
      else downloadIcs(ev.id, evText(ev,"title"), evText(ev,"summary"), ev.link, ev.date, nextDay(ev.end || ev.date), true); } return; }
    if(e.target.closest("#f-clear")){ st.min = 6; st.cat = "All"; st.cont = "All"; ["min","cat","cont"].forEach(k=>store.set(k, st[k])); render(); return; }
    const cb = e.target.closest("[data-cont]"); if(cb){ setCont(cb.dataset.cont); return; }
    const j = e.target.closest("[data-jump]");
    if(j){
      let el = document.getElementById("s-"+j.dataset.jump);
      if(!el){ st.min = 0; st.cat = "All"; st.cont = "All"; render(); el = document.getElementById("s-"+j.dataset.jump); }
      if(el){ el.scrollIntoView({behavior:"smooth", block:"center"}); el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"), 1400); }
      return;
    }
    const act = e.target.closest("[data-act]"); if(!act) return;
    const card = act.closest(".card"); if(!card) return;
    const id = card.dataset.id, s = st.stories.find(x=>x.id===id); if(!s) return;
    const l = L();
    switch(act.dataset.act){
      case "read": st.read.add(id); store.set("read", Array.from(st.read).slice(-500)); setTimeout(renderFeed, 300); break;
      case "why": st.open.has(id) ? st.open.delete(id) : st.open.add(id); renderFeed(); break;
      case "save":
        st.saved.has(id) ? st.saved.delete(id) : st.saved.add(id); store.set("saved", Array.from(st.saved));
        renderHeader(); renderFeed(); toast(st.saved.has(id) ? l.savedToast : l.removed); break;
      case "share":
        if(canShare){ navigator.share({title: tx(s,"title"), text: tx(s,"summary"), url: s.url}).catch(()=>{}); break; }
        try{ navigator.clipboard.writeText(tx(s,"title")+" — "+s.url).then(()=>toast(l.copied), ()=>toast(s.url)); }catch(err){ toast(s.url); }
        break;
    }
  });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape") closeLang();
    const p = e.target.closest && e.target.closest("path[data-cont]");
    if(p && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); setCont(p.dataset.cont); }
  });
  $("#min").addEventListener("input", e => {
    st.min = Number(e.target.value); store.set("min", st.min);
    renderSlider(); renderFeed(); renderWorld();
  });
  document.addEventListener("change", e => {
    const id = e.target.id;
    if(id === "min"){ render(); return; }
    else if(id === "f-cat"){ st.cat = e.target.value; store.set("cat", st.cat); }
    else if(id === "f-cont"){ st.cont = e.target.value; store.set("cont", st.cont); }
    else if(id === "f-sort"){ st.sort = e.target.value; store.set("sort", st.sort); }
    else return;
    render();
  });
  matchMedia("(min-width:1000px)").addEventListener?.("change", ev => { if(ev.matches && st.tab === "world"){ st.tab = "news"; render(); } });
  document.addEventListener("visibilitychange", () => {
    if(document.hidden){ store.set("lastVisit", new Date().toISOString()); }
    else if(Date.now() - st.fetchedAt > 15*60000){ load(); }
  });
  window.addEventListener("pagehide", () => store.set("lastVisit", new Date().toISOString()));
  setInterval(() => { if(!document.hidden) renderHeader(); }, 60000);

  // ---------- data ----------
  async function getJSON(url){ const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json(); }
  async function load(){
    try{
      const data = await getJSON("stories.json?t="+Date.now());
      st.stories = Array.isArray(data.stories) ? data.stories.map(s => Object.assign({continent:"Global"}, s)) : [];
      st.meta = {updated: data.updated, sources: data.sources};
      st.loaded = true; st.failed = false; st.fetchedAt = Date.now();
    }catch(e){ st.failed = true; }
    render();
  }
  render(); load();
  getJSON("world.json").then(w => { st.world = w; renderWorld(); }).catch(()=>{});
  getJSON("site.json").then(s => { st.site = s; renderAbout(); }).catch(()=>{});
  function loadCalendar(){
    getJSON("events.json?t="+Date.now()).then(d => { st.events = d; renderCalendar(); }).catch(()=>{ st.events = {events:[]}; renderCalendar(); });
    getJSON("nobel.json?t="+Date.now()).then(d => { st.nobel = d; renderCalendar(); }).catch(()=>{});
  }
  loadCalendar();
  // During Nobel announcement days, refresh the hub every 5 minutes while the Calendar tab is open.
  setInterval(() => {
    if(document.hidden || st.tab !== "calendar" || !st.nobel) return;
    const now = Date.now();
    if(st.nobel.prizes.some(p => now >= Date.parse(p.at) - 3600e3 && now <= Date.parse(p.at) + 12*3600e3)) loadCalendar();
    else renderCalendar();
  }, 5*60000);

  if("serviceWorker" in navigator){ window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{})); }
})();
</script>
</body>
</html>
