name: Update site

# Every hour: pick up new run files from the Google Drive folder, update
# stories.json and feed.xml, commit them, and publish the site.
# Any push to main (for example editing a file on GitHub) also republishes it.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch new stories from Google Drive
        id: pull
        if: github.event_name != 'push'
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: python3 scripts/pull_from_drive.py

      - name: Commit updated stories
        if: steps.pull.outputs.changed == 'true'
        run: |
          git config user.name "Good News bot"
          git config user.email "goodnews-bot@users.noreply.github.com"
          git add stories.json feed.xml
          git diff --cached --quiet || git commit -m "Update stories from Drive"
          git push

      - name: Configure Pages
        if: github.event_name != 'schedule' || steps.pull.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      - name: Upload site
        if: github.event_name != 'schedule' || steps.pull.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Publish site
        id: deploy
        if: github.event_name != 'schedule' || steps.pull.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
